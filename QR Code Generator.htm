<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A client-side QR code generator for text, URLs, and Wi-Fi networks."
    />
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <style>
      :root {
        --background: #fbfaf8;
        --foreground: #18202d;
        --muted: #667085;
        --line: #e8e3dc;
        --surface: #ffffff;
        --surface-muted: #f2f3f6;
        --accent: #f87920;
        --accent-dark: #df5d0b;
        --success: #18875d;
        --radius: 20px;
        font-family:
          "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--foreground);
        background:
          radial-gradient(circle at 10% 0%, rgba(248, 121, 32, 0.1), transparent 28rem),
          var(--background);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .app {
        width: min(100% - 32px, 440px);
        margin: 0 auto;
        padding: 34px 0 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 8px;
        margin-bottom: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        color: white;
        background: var(--accent);
        border-radius: 14px;
        box-shadow: 0 5px 0 rgba(223, 93, 11, 0.2);
      }

      .brand-mark svg {
        width: 21px;
        height: 21px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .tagline {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .settings-button {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
      }

      .settings-button:hover,
      .settings-button:focus-visible {
        color: var(--foreground);
        background: var(--surface-muted);
        outline: none;
      }

      .card {
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 18px 42px rgba(24, 32, 45, 0.08);
      }

      .card-content {
        padding: 20px 24px 24px;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        margin-bottom: 18px;
        background: var(--surface-muted);
        border-radius: 16px;
      }

      .mode-button {
        min-height: 40px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        transition: 160ms ease;
      }

      .mode-button.active {
        color: var(--foreground);
        background: var(--surface);
        box-shadow: 0 2px 8px rgba(24, 32, 45, 0.08);
      }

      .mode-button:hover {
        color: var(--foreground);
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field + .field {
        margin-top: 14px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .input,
      .select {
        width: 100%;
        min-height: 52px;
        padding: 0 14px;
        color: var(--foreground);
        background: rgba(242, 243, 246, 0.72);
        border: 1px solid transparent;
        border-radius: 16px;
        outline: none;
        transition: 160ms ease;
      }

      .input:focus,
      .select:focus {
        background: var(--surface);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(248, 121, 32, 0.14);
      }

      .password-wrap {
        position: relative;
      }

      .password-wrap .input {
        padding-right: 44px;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 12px;
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        color: var(--muted);
        background: transparent;
        border: 0;
        transform: translateY(-50%);
      }

      .check-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }

      .check-row input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      .helper {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .qr-stage {
        position: relative;
        display: grid;
        width: min(100%, 320px);
        aspect-ratio: 1;
        place-items: center;
        margin: 4px auto 0;
        overflow: hidden;
        background: white;
        border: 1px solid #eeeae4;
        border-radius: 20px;
      }

      #qr-canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .qr-empty {
        position: absolute;
        display: grid;
        gap: 10px;
        place-items: center;
        color: #dce2ea;
        text-align: center;
      }

      .qr-empty svg {
        width: 72px;
        height: 72px;
        stroke-width: 1.15;
      }

      .qr-empty span {
        color: #a6afbc;
        font-size: 12px;
      }

      .actions {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 10px;
        padding: 16px;
        background: rgba(242, 243, 246, 0.65);
        border-top: 1px solid var(--line);
      }

      .action-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: white;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 15px;
        font-size: 14px;
        font-weight: 800;
        transition: 160ms ease;
      }

      .action-button:hover:not(:disabled) {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
        transform: translateY(-1px);
      }

      .action-button.secondary {
        width: 48px;
        color: var(--muted);
        background: transparent;
        border-color: #d9dce1;
      }

      .action-button.secondary:hover:not(:disabled) {
        color: var(--foreground);
        background: var(--surface);
        border-color: #c9ced7;
      }

      .status {
        min-height: 20px;
        margin-top: 12px;
        color: var(--success);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .privacy {
        margin-top: 20px;
        color: #8d96a3;
        font-family: "Space Mono", ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      .popover {
        position: absolute;
        z-index: 3;
        top: 82px;
        right: 0;
        width: 260px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 16px 36px rgba(24, 32, 45, 0.14);
      }

      .settings-wrap {
        position: relative;
      }

      .popover[hidden],
      [hidden] {
        display: none !important;
      }

      .popover-title {
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 800;
      }

      .popover .field + .field {
        margin-top: 12px;
      }

      .popover .select {
        min-height: 40px;
        font-size: 12px;
      }

      @media (max-width: 520px) {
        .app {
          width: min(100% - 20px, 440px);
          padding-top: 20px;
        }

        .card-content {
          padding-inline: 16px;
        }

        .field-row {
          grid-template-columns: 1fr;
          gap: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM18 18h2v2h-2z" />
            </svg>
          </div>
          <div>
            <h1>QR Generator</h1>
            <p class="tagline">Instant · Client-side</p>
          </div>
        </div>

        <div class="settings-wrap">
          <button class="settings-button" id="settings-button" type="button" aria-label="Open QR settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2" />
              <circle cx="16" cy="6" r="2" />
              <circle cx="8" cy="12" r="2" />
              <circle cx="16" cy="18" r="2" />
            </svg>
          </button>
          <div class="popover" id="settings-popover" hidden>
            <p class="popover-title">QR Code Settings</p>
            <div class="field">
              <label class="field-label" for="size">Export size</label>
              <select class="select" id="size">
                <option value="256">Small (256 × 256)</option>
                <option value="512" selected>Medium (512 × 512)</option>
                <option value="1024">Large (1024 × 1024)</option>
                <option value="2048">Ultra (2048 × 2048)</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="error-level">Error correction</label>
              <select class="select" id="error-level">
                <option value="L">Low (7%)</option>
                <option value="M">Medium (15%)</option>
                <option value="Q" selected>Quartile (25%)</option>
                <option value="H">High (30%)</option>
              </select>
            </div>
          </div>
        </div>
      </header>

      <section class="card" aria-label="QR code generator">
        <div class="card-content">
          <div class="mode-switch" role="tablist" aria-label="QR code type">
            <button class="mode-button active" id="text-mode" type="button" role="tab" aria-selected="true">
              Text or URL
            </button>
            <button class="mode-button" id="wifi-mode" type="button" role="tab" aria-selected="false">
              Wi-Fi
            </button>
          </div>

          <div id="text-form">
            <div class="field">
              <label class="field-label" for="text-input">Content</label>
              <input class="input" id="text-input" type="text" placeholder="Paste a URL or type something..." autocomplete="off" autofocus />
            </div>
          </div>

          <div id="wifi-form" hidden>
            <div class="field">
              <label class="field-label" for="network-name">Network name (SSID)</label>
              <input class="input" id="network-name" type="text" placeholder="e.g. Home Wi-Fi" autocomplete="off" />
            </div>

            <div class="field-row">
              <div class="field">
                <label class="field-label" for="network-security">Security</label>
                <select class="select" id="network-security">
                  <option value="WPA" selected>WPA / WPA2</option>
                  <option value="WEP">WEP</option>
                  <option value="nopass">Open network</option>
                </select>
              </div>

              <div class="field">
                <label class="field-label" for="network-password">Password</label>
                <div class="password-wrap">
                  <input class="input" id="network-password" type="password" placeholder="Enter password" autocomplete="off" />
                  <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password">
                    <svg id="eye-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                      <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z" />
                      <circle cx="12" cy="12" r="2.5" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <label class="check-row">
              <input id="hidden-network" type="checkbox" />
              This is a hidden network
            </label>
            <p class="helper">Scan this code with a phone camera to join the network without typing the password.</p>
          </div>

          <div class="qr-stage" aria-live="polite">
            <canvas id="qr-canvas" aria-label="Generated QR code"></canvas>
            <div class="qr-empty" id="qr-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM18 18h2v2h-2z" />
              </svg>
              <span>Your QR code will appear here</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="action-button secondary" id="copy-button" type="button" aria-label="Copy QR content" title="Copy QR content">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="8" y="8" width="11" height="11" rx="2" />
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
            </svg>
          </button>
          <button class="action-button" id="download-button" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 3v12M7 10l5 5 5-5M5 20h14" />
            </svg>
            Download QR
          </button>
        </div>
      </section>

      <p class="status" id="status" role="status"></p>
      <p class="privacy">Data never leaves your device.</p>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById("qr-canvas");
        const emptyState = document.getElementById("qr-empty");
        const textModeButton = document.getElementById("text-mode");
        const wifiModeButton = document.getElementById("wifi-mode");
        const textForm = document.getElementById("text-form");
        const wifiForm = document.getElementById("wifi-form");
        const textInput = document.getElementById("text-input");
        const networkName = document.getElementById("network-name");
        const networkSecurity = document.getElementById("network-security");
        const networkPassword = document.getElementById("network-password");
        const hiddenNetwork = document.getElementById("hidden-network");
        const passwordToggle = document.getElementById("password-toggle");
        const sizeSelect = document.getElementById("size");
        const errorLevelSelect = document.getElementById("error-level");
        const copyButton = document.getElementById("copy-button");
        const downloadButton = document.getElementById("download-button");
        const status = document.getElementById("status");
        const settingsButton = document.getElementById("settings-button");
        const settingsPopover = document.getElementById("settings-popover");
        let mode = "text";
        let showPassword = false;

        function escapeWifiValue(value) {
          return value.replace(/([\\;,:"'])/g, "\\$1");
        }

        function getContent() {
          if (mode === "text") return textInput.value;
          if (!networkName.value.trim()) return "";
          return [
            "WIFI:",
            "T:" + networkSecurity.value,
            ";S:" + escapeWifiValue(networkName.value),
            ";P:" + escapeWifiValue(networkPassword.value),
            ";H:" + hiddenNetwork.checked,
            ";;",
          ].join("");
        }

        function setStatus(message, isError = false) {
          status.textContent = message;
          status.style.color = isError ? "#c83d32" : "var(--success)";
          window.clearTimeout(setStatus.timeout);
          if (message) {
            setStatus.timeout = window.setTimeout(() => {
              status.textContent = "";
            }, 2400);
          }
        }

        function refresh() {
          const content = getContent().trim();
          const hasContent = Boolean(content);
          emptyState.hidden = hasContent;
          canvas.style.opacity = hasContent ? "1" : "0";
          copyButton.disabled = !hasContent;
          downloadButton.disabled = !hasContent;

          if (!hasContent) {
            const context = canvas.getContext("2d");
            context.clearRect(0, 0, canvas.width, canvas.height);
            return;
          }

          QRCode.toCanvas(
            canvas,
            content,
            {
              width: Number(sizeSelect.value),
              margin: 2,
              errorCorrectionLevel: errorLevelSelect.value,
              color: { dark: "#18202d", light: "#ffffff" },
            },
            (error) => {
              if (error) setStatus("Could not generate this QR code.", true);
            },
          );
        }

        function setMode(nextMode) {
          mode = nextMode;
          const isText = mode === "text";
          textModeButton.classList.toggle("active", isText);
          wifiModeButton.classList.toggle("active", !isText);
          textModeButton.setAttribute("aria-selected", String(isText));
          wifiModeButton.setAttribute("aria-selected", String(!isText));
          textForm.hidden = !isText;
          wifiForm.hidden = isText;
          refresh();
          (isText ? textInput : networkName).focus();
        }

        textModeButton.addEventListener("click", () => setMode("text"));
        wifiModeButton.addEventListener("click", () => setMode("wifi"));
        [textInput, networkName, networkPassword, hiddenNetwork, networkSecurity, sizeSelect, errorLevelSelect].forEach((element) => {
          element.addEventListener("input", refresh);
          element.addEventListener("change", refresh);
        });

        networkSecurity.addEventListener("change", () => {
          const isOpen = networkSecurity.value === "nopass";
          networkPassword.disabled = isOpen;
          networkPassword.placeholder = isOpen ? "Not needed" : "Enter password";
          refresh();
        });

        passwordToggle.addEventListener("click", () => {
          showPassword = !showPassword;
          networkPassword.type = showPassword ? "text" : "password";
          passwordToggle.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
        });

        copyButton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(getContent());
            setStatus("QR content copied.");
          } catch {
            setStatus("Clipboard access is unavailable.", true);
          }
        });

        downloadButton.addEventListener("click", () => {
          if (!getContent().trim()) return;
          const link = document.createElement("a");
          const label = (mode === "wifi" ? networkName.value : textInput.value)
            .slice(0, 24)
            .replace(/[^a-z0-9]/gi, "-") || "code";
          link.download = "qr-" + label + ".png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          setStatus("PNG downloaded.");
        });

        settingsButton.addEventListener("click", () => {
          const isHidden = settingsPopover.hidden;
          settingsPopover.hidden = !isHidden;
          settingsButton.setAttribute("aria-expanded", String(isHidden));
        });

        document.addEventListener("click", (event) => {
          if (!event.target.closest(".settings-wrap")) {
            settingsPopover.hidden = true;
            settingsButton.setAttribute("aria-expanded", "false");
          }
        });

        refresh();
      })();
    </script>
  </body>
</html>
